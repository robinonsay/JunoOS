# Deliberately no [build] target: this workspace is architecture-neutral.
# Portable crates (api) build and test for the host; each board crate is
# built for its own triple via the aliases below — one per supported
# architecture. Applications generated from a board template under
# templates/ carry their own board-specific .cargo/config.toml instead.
# Cargo also reads .cargo/config.toml in parent directories, so when this
# repo is checked out inside an application that sets a [build] target,
# pass --target explicitly (e.g. `cargo test -p api --target <host triple>`).
[alias]
pico2 = "build -p pico2 --target thumbv8m.main-none-eabihf"
